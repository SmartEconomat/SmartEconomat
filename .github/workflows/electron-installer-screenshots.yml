name: Electron Installer screenshots

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "ElectronInstaller/**"
      - ".github/workflows/electron-installer-screenshots.yml"

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ElectronInstaller
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ElectronInstaller/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium

      - name: Build installer for capture
        run: npm run build:app:capture

      - name: Capture screenshots
        run: npm run capture:screenshots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-screenshots-${{ matrix.os }}
          path: ElectronInstaller/screenshots/
          if-no-files-found: error
