name: Documentacion - enlaces internos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-docs-internal-links.mjs'
      - '.github/workflows/docs-internal-links.yml'
  push:
    branches: [develop, main, production]
    paths:
      - 'docs/**'
      - 'scripts/check-docs-internal-links.mjs'
      - '.github/workflows/docs-internal-links.yml'

jobs:
  verify-docs-links:
    name: Verificar enlaces relativos en docs/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar Markdown (sin HTTP)
        run: node scripts/check-docs-internal-links.mjs
