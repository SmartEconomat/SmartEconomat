name: SmartEconomat Installer - E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'ElectronInstaller/**'
      - '.github/workflows/installer-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ElectronInstaller/**'

jobs:
  e2e:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'ElectronInstaller/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./ElectronInstaller
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./ElectronInstaller
        run: npx playwright install --with-deps chromium
      
      - name: Run ESLint
        working-directory: ./ElectronInstaller
        run: npm run lint
      
      - name: Run Type Check
        working-directory: ./ElectronInstaller
        run: npm run type-check
      
      - name: Run Unit Tests
        working-directory: ./ElectronInstaller
        run: npm run test
        continue-on-error: true
      
      - name: Run E2E Tests
        working-directory: ./ElectronInstaller
        run: npm run test:e2e
        continue-on-error: false
      
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: ElectronInstaller/test-results/
          retention-days: 30
      
      - name: Upload E2E HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: ElectronInstaller/test-results/reports/html/
          retention-days: 30
      
      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './ElectronInstaller/test-results/results.json';
            
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const stats = results.stats;
              
              const comment = `## E2E Test Results - ${{ matrix.os }}
              
              - **Tests Run**: ${stats.expected}
              - **Passed**: ${stats.expected - stats.unexpected}
              - **Failed**: ${stats.unexpected}
              - **Duration**: ${(stats.duration / 1000).toFixed(2)}s
              
              [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  build:
    needs: e2e
    if: success()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, win, mac]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'ElectronInstaller/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./ElectronInstaller
        run: npm ci
      
      - name: Build app
        working-directory: ./ElectronInstaller
        run: npm run build:${{ matrix.target }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: ElectronInstaller/dist/
          retention-days: 7
