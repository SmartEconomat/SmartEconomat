name: Despliegue a Produccion

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  NODE_VERSION: '22.13.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  APP_NAME: SmartEconomat
  ARCHIVE_NAME: SmartEconomat_AI_Upload.zip
  REMOTE_BASE_DIR: /root

jobs:
  build-and-test:
    name: Validar Backend y Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/smart-economat-backend/package-lock.json
            frontend/smart-economat-frontend/package-lock.json
            ElectronInstaller/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend/smart-economat-backend
        run: npm ci

      - name: Lint backend
        working-directory: backend/smart-economat-backend
        run: npm run lint

      - name: Tests backend
        working-directory: backend/smart-economat-backend
        run: npm run test

      - name: Construir backend
        working-directory: backend/smart-economat-backend
        run: npm run build

      - name: Instalar dependencias del frontend
        working-directory: frontend/smart-economat-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend/smart-economat-frontend
        run: npm run lint

      - name: Tests frontend
        working-directory: frontend/smart-economat-frontend
        run: npm run test

      - name: Construir frontend
        working-directory: frontend/smart-economat-frontend
        run: npm run build

      - name: Instalar dependencias del installer
        working-directory: ElectronInstaller
        run: npm ci

      - name: Lint installer
        working-directory: ElectronInstaller
        run: npm run lint

      - name: Type-check installer
        working-directory: ElectronInstaller
        run: npm run type-check

      - name: Tests installer
        working-directory: ElectronInstaller
        run: npm run test

      - name: Build installer app
        working-directory: ElectronInstaller
        run: npm run build:app

  deploy:
    name: Desplegar en servidor
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: SmartEconomatEnv

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Crear paquete de despliegue
        run: |
          rm -f "${{ env.ARCHIVE_NAME }}"
          zip -r "${{ env.ARCHIVE_NAME }}" . \
            -x ".git/*" \
            -x ".github/workflows/*" \
            -x "**/node_modules/*" \
            -x "**/dist/*" \
            -x "**/coverage/*" \
            -x "**/.env" \
            -x "**/.env.*" \
            -x "deploy_key" \
            -x "deploy_key.pub"

      - name: Subir paquete al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SMARTECONOMAT_DO }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: ${{ env.ARCHIVE_NAME }}
          target: ${{ env.REMOTE_BASE_DIR }}
          overwrite: true

      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_NAME: ${{ env.APP_NAME }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
          REMOTE_BASE_DIR: ${{ env.REMOTE_BASE_DIR }}
          NODE_ENV: production
          DOMAIN: ${{ secrets.DOMAIN }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          TLS_PROVIDER: ${{ secrets.TLS_PROVIDER }}
          TLS_SELF_SIGNED_DAYS: ${{ secrets.TLS_SELF_SIGNED_DAYS }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          LETSENCRYPT_DIRECTORY_URL: ${{ secrets.LETSENCRYPT_DIRECTORY_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SMARTECONOMAT_DO }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          envs: APP_NAME,ARCHIVE_NAME,REMOTE_BASE_DIR,NODE_ENV,DOMAIN,BACKEND_API_URL,FRONTEND_API_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE,JWT_SECRET,JWT_EXPIRATION,VITE_API_PROXY_TARGET,SENTRY_DSN,VITE_SENTRY_DSN,TLS_PROVIDER,TLS_SELF_SIGNED_DAYS,LETSENCRYPT_EMAIL,LETSENCRYPT_DIRECTORY_URL
          script: |
            set -e
            # Instalar unzip si no existe (necesario para el primer despliegue)
            if ! command -v unzip &> /dev/null; then
              echo "Instalando unzip..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" unzip
            fi

            ARCHIVE_PATH="$REMOTE_BASE_DIR/$ARCHIVE_NAME"
            HELPER_DIR=$(mktemp -d)

            if [ ! -f "$ARCHIVE_PATH" ]; then
              echo "No se encontro el paquete de despliegue en $ARCHIVE_PATH"
              exit 1
            fi

            unzip -q "$ARCHIVE_PATH" scripts/deploy.sh -d "$HELPER_DIR"
            chmod +x "$HELPER_DIR/scripts/deploy.sh"
            "$HELPER_DIR/scripts/deploy.sh"
            rm -rf "$HELPER_DIR"

  notify:
    name: Notificaciones post-despliegue
    needs: [build-and-test, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enviar mensaje a Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''