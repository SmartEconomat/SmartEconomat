name: smarteconomat-prod

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: smarteconomat-db:prod
    restart: always
    init: true
    env_file: .env.prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-}
    volumes:
      - database_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: always
    init: true
    command: redis-server --appendonly yes
    volumes:
      - redis_prod:/data
    networks:
      - backend-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  backend:
    build:
      context: ./backend/smart-economat-backend
      dockerfile: ../Dockerfile.prod
    image: smarteconomat-backend:prod
    restart: always
    init: true
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_API_URL=${FRONTEND_API_URL:-https://smarteconomat.app}
      - BACKEND_API_URL=${BACKEND_API_URL:-https://smarteconomat.app/api/v1}
      - DOMAIN=${DOMAIN:-smarteconomat.app}
      - DB_SYNC=${DB_SYNC:-false}
      - STARTUP_RUN_MIGRATIONS=${STARTUP_RUN_MIGRATIONS:-true}
      - SEED_DEFAULT_ADMIN_TEMP_PASSWORD=${SEED_DEFAULT_ADMIN_TEMP_PASSWORD:-}
    networks:
      - backend-network
      - frontend-network
    volumes:
      - uploads_prod:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/docs']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend/smart-economat-frontend
      dockerfile: ../Dockerfile.prod
      args:
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    image: smarteconomat-frontend:prod
    restart: always
    init: true
    ports:
      - '80:80'
      - '443:443'
    env_file: .env.prod
    environment:
      - DOMAIN=${DOMAIN:-smarteconomat.app}
      - FRONTEND_API_URL=${FRONTEND_API_URL:-https://smarteconomat.app}
      - BACKEND_API_URL=${BACKEND_API_URL:-https://smarteconomat.app/api/v1}
    networks:
      - frontend-network
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./certs-webroot:/var/www/acme-challenge:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  database_prod:
  redis_prod:
  uploads_prod:

networks:
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
