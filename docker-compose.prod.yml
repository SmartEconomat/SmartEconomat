name: smarteconomat-prod

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: smarteconomat-db:prod
    restart: always
    env_file: .env.prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - database_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend/smart-economat-backend
      dockerfile: ../Dockerfile.prod
    image: smarteconomat-backend:prod
    restart: always
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_API_URL=${FRONTEND_API_URL}
      - BACKEND_API_URL=${BACKEND_API_URL}
      - DOMAIN=${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    volumes:
      - ./uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend/smart-economat-frontend
      dockerfile: ../Dockerfile.prod
      args:
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    image: smarteconomat-frontend:prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '5173:80' # Backup mapping
    env_file: .env.prod
    networks:
      - frontend-network
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  database_prod:
  redis_prod:

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
