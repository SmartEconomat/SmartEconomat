name: smarteconomat-prod
services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: smarteconomat-db:prod

    restart: always
    env_file: .env.prod
    volumes:
      - database_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarteconomat-prod-network

  backend:
    build:

      context: ./backend/smart-economat-backend
      dockerfile: ../Dockerfile.prod
    image: smarteconomat-backend:prod

    restart: always
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file: .env.prod
    environment:
      # ── Info del anfitrión (inyectada por scripts/collect-host-info.sh o .ps1) ──
      - HOST_USER=${USER:-}
      - HOST_HOSTNAME=${HOSTNAME:-}
      - HOST_PWD=${PWD:-}
      - HOST_SHELL=${SHELL:-}
      - HOST_MAC=${HOST_MAC:-}
      - HOST_GIT_USER=${GIT_USER:-}
      - HOST_GIT_EMAIL=${GIT_EMAIL:-}
    command: sh -c "npx ts-node scripts/log-user-info.ts && npm run start:prod"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smarteconomat-prod-network
    volumes:
      - ./:/project_root
      - ~/.gitconfig:/root/.gitconfig:ro

  frontend:
    build:
      context: ./frontend/smart-economat-frontend
      dockerfile: ../Dockerfile.prod
      args:
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    image: smarteconomat-frontend:prod

    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    env_file: .env.prod
    networks:
      - smarteconomat-prod-network

volumes:
  database_prod:

networks:
  smarteconomat-prod-network:
    driver: bridge
