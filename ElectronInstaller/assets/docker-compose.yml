name: smarteconomat-prod
services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: smarteconomat-db:prod

    restart: always
    env_file: .env.prod
    volumes:
      - database_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarteconomat-prod-network

  backend:
    build:
      context: ./backend/smart-economat-backend
      dockerfile: ../Dockerfile.prod
    image: smarteconomat-backend:prod

    restart: always
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smarteconomat-prod-network

  frontend:
    build:
      context: ./frontend/smart-economat-frontend
      dockerfile: ../Dockerfile.prod
    image: smarteconomat-frontend:prod

    restart: always
    ports:
      - '${FRONTEND_PORT}:80'
    env_file: .env.prod
    networks:
      - smarteconomat-prod-network

volumes:
  database_prod:

networks:
  smarteconomat-prod-network:
    driver: bridge
