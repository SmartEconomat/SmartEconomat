name: smarteconomat-dev
services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: smarteconomat-db:dev
    env_file: .env.dev
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - database_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarteconomat-dev-network

  backend:
    build:
      context: ./backend/smart-economat-backend
      dockerfile: ../Dockerfile.dev
    image: smarteconomat-backend:dev
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file: .env.dev
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smarteconomat-dev-network
    volumes:
      - ./backend/smart-economat-backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend/smart-economat-frontend
      dockerfile: ../Dockerfile.dev
    image: smarteconomat-frontend:dev
    ports:
      - "${FRONTEND_PORT}:5173"
    env_file: .env.dev
    networks:
      - smarteconomat-dev-network
    volumes:
      - ./frontend/smart-economat-frontend:/app
      - /app/node_modules

volumes:
  database_dev:

networks:
  smarteconomat-dev-network:
    driver: bridge
