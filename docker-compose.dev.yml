name: smarteconomat-dev
services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: smarteconomat-db:dev
    env_file: .env.dev
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - database_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s
    networks:
      - smarteconomat-dev-network

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_dev:/data
    networks:
      - smarteconomat-dev-network

  backend:
    build:
      context: ./backend/smart-economat-backend
      dockerfile: ../Dockerfile.dev
    image: smarteconomat-backend:dev
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    env_file: .env.dev
    environment:
      - HOME=/tmp
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      # ── Info del anfitrión (inyectada por scripts/collect-host-info.sh o .ps1) ──
      - HOST_USER=${USER:-}
      - HOST_HOSTNAME=${HOSTNAME:-}
      - HOST_PWD=${PWD:-}
      - HOST_SHELL=${SHELL:-}
      - HOST_MAC=${HOST_MAC:-}
      - HOST_GIT_USER=${GIT_USER:-}
      - HOST_GIT_EMAIL=${GIT_EMAIL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "dos2unix scripts/ensure-deps.sh 2>/dev/null; sh scripts/ensure-deps.sh && npx ts-node scripts/log-user-info.ts && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smarteconomat-dev-network
    volumes:
      - ./backend/smart-economat-backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
      - ./:/project_root
      - ~/.gitconfig:/tmp/.gitconfig:ro

  frontend:
    build:
      context: ./frontend/smart-economat-frontend
      dockerfile: ../Dockerfile.dev
    image: smarteconomat-frontend:dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '${FRONTEND_PORT}:5173'
    env_file: .env.dev
    environment:
      - HOME=/tmp
    networks:
      - smarteconomat-dev-network
    volumes:
      - ./frontend/smart-economat-frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  database_dev:
  redis_dev:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:

networks:
  smarteconomat-dev-network:
    driver: bridge
